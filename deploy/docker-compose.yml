# Production stack for the Hostinger VPS. Lives at /opt/exacta/docker-compose.yml with an .env next to it.
# The web image is built by GitHub Actions and pulled from GHCR.
# Ports bind to 127.0.0.1 because Docker bypasses ufw: only the host nginx is public.
# Memory limits keep the stack from starving the other apps on this KVM 1.

services:
  web:
    image: ghcr.io/sebagoiburo/exacta:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://exacta:${POSTGRES_PASSWORD}@db:5432/exacta
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      NODE_OPTIONS: --max-old-space-size=512
      # Reachable over the Docker network, so events never leave the server.
      N8N_EVENTS_WEBHOOK_URL: http://n8n:5678/webhook/exacta-events
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    ports:
      - '127.0.0.1:3000:3000'
    mem_limit: 768m
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.45.7}
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_PROXY_HOPS: 1
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_ENABLED: 'true'
      GENERIC_TIMEZONE: America/Argentina/Mendoza
      TZ: America/Argentina/Mendoza
      NODE_OPTIONS: --max-old-space-size=512
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # Execution history is the main source of disk and database growth.
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 5000
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      # Secret shared with the site to verify signed events (x-exacta-signature).
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - n8n:/home/node/.n8n
    ports:
      - '127.0.0.1:5678:5678'
    mem_limit: 768m
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_connections=40
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
    environment:
      POSTGRES_USER: exacta
      POSTGRES_DB: exacta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Only runs the first time the data volume is created.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U exacta']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    logging: *logging

volumes:
  media:
  pgdata:
  n8n:
