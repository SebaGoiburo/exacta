# The public site. Certbot adds the certificate:
# certbot --nginx --cert-name exactatransformaciondigital.com -d exactatransformaciondigital.com -d www.exactatransformaciondigital.com
server {
    listen 80;
    server_name exactatransformaciondigital.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name www.exactatransformaciondigital.com;
    return 301 https://exactatransformaciondigital.com$request_uri;
}
