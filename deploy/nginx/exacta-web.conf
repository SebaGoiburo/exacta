# The test address the site used before moving to the main domain. Old links keep working.
# Certbot adds the HTTPS part: certbot --nginx -d nuevo.exactatransformaciondigital.com
server {
    listen 80;
    server_name nuevo.exactatransformaciondigital.com;

    location / {
        return 301 https://exactatransformaciondigital.com$request_uri;
    }
}
